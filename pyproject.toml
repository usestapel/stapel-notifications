[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-notifications"
version = "0.20.0"
description = "Push and in-app notifications Django app for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "notifications", "push", "firebase", "telegram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor: 0.26.0 emits docs/errors.json with the `owner` field the
    # committed artifact and its drift gate require. (0.24.0 had already
    # turned comm schema validation on outside DEBUG and made jsonschema a
    # base dep.)
    "stapel-core>=0.26.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-notifications"
Repository = "https://github.com/usestapel/stapel-notifications"
Documentation = "https://github.com/usestapel/stapel-notifications#readme"
Changelog = "https://github.com/usestapel/stapel-notifications/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-notifications/issues"

[project.optional-dependencies]
firebase = ["firebase-admin>=6.4"]
kafka = ["confluent-kafka>=2.3"]
# The feed socket. An extra, not a base dependency — the deliberate
# difference from stapel-chat, whose product IS the socket. This library's
# product is a delivered notification plus a REST feed, both complete without
# realtime; the stream only saves the reload. Emitting the frame costs
# nothing either way (stapel_core.comm.signal is a no-op with no transport),
# so the extra buys the serving half: the consumer, the authorize gate, the
# Channels stack. See MODULE.md § "Live feed" and checks W006.
realtime = ["stapel-realtime[channels]>=0.1.2,<1.0"]
# `all` deliberately does NOT include `realtime`: the socket half is a
# deployment choice (a Channels stack), not a feature every host wants.
all = ["stapel-notifications[firebase,kafka]"]
# ONE declaration of what the suite needs. The feed-socket tests drive
# channels.testing, which imports daphne — a sibling nobody declared is how
# 0.17.0 shipped red. CI installs `.[test]`, never a hand-kept list.
test = [
    "stapel-notifications[realtime]",
    "channels[daphne]>=4.0",
    "pytest",
    "pytest-django",
    "pytest-asyncio",
    "pytest-cov",
    "stapel-tools>=0.35.0,<1",
]

[tool.setuptools]
package-dir = {"stapel_notifications" = "."}
packages = ["stapel_notifications", "stapel_notifications.channels", "stapel_notifications.management", "stapel_notifications.management.commands", "stapel_notifications.migrations"]

[tool.setuptools.package-data]
stapel_notifications = ["py.typed", "migrations/*.py", "schemas/**/*.json", "translations/*.json", "templates/**/*", "static/**/*", "locale/**/*.po", "locale/**/*.mo", "migrations/**/*.py", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "docs/templates.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q"

[tool.coverage.run]
# Measure the shipped library code only: the packaged test suite, its
# conftest and the migration files are distributed for reuse but are not
# runtime code exercised by the host project.
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
